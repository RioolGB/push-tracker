services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Внутренний порт приложения. НЕ публикуется на хост — доступен только внутри сети compose,
      # поэтому уже работающий на сервере трекер на :3000 не конфликтует.
      PORT: ${APP_PORT:-3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?укажите ADMIN_PASSWORD в .env}
      SESSION_SECRET: ${SESSION_SECRET:?укажите SESSION_SECRET в .env}
      POSTBACK_TOKEN: ${POSTBACK_TOKEN:?укажите POSTBACK_TOKEN в .env}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      REDIS_URL: redis://redis:6379
      DATABASE_PATH: /app/backend/data/tracker.db
      LOG_FILE_ENABLED: "true"
      LOG_DIR: /app/backend/logs
      TRUST_PROXY: "true"
    volumes:
      - tracker-data:/app/backend/data
      - tracker-logs:/app/backend/logs
    expose:
      - "${APP_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://127.0.0.1:$$PORT/health\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:-_}
      APP_PORT: ${APP_PORT:-3000}
    volumes:
      # Шаблон конфига: nginx-образ сам подставит TRACKER_DOMAIN и APP_PORT (entrypoint envsubst).
      - ./nginx:/etc/nginx/templates:ro

volumes:
  redis-data:
  tracker-data:
  tracker-logs: