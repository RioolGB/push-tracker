services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Внутренний порт приложения (по умолчанию 3000). Бесплатный хост-порт выбирается в TRACKER_PORT.
      PORT: ${APP_PORT:-3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?укажите ADMIN_PASSWORD в .env}
      SESSION_SECRET: ${SESSION_SECRET:?укажите SESSION_SECRET в .env}
      POSTBACK_TOKEN: ${POSTBACK_TOKEN:?укажите POSTBACK_TOKEN в .env}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      REDIS_URL: redis://redis:6379
      DATABASE_PATH: /app/backend/data/tracker.db
      LOG_FILE_ENABLED: "true"
      LOG_DIR: /app/backend/logs
      # Перед приложением стоит ВАШ nginx (80/8080): берём первый hop из X-Forwarded-For.
      TRUST_PROXY: "true"
    ports:
      - "${TRACKER_PORT:-3001}:${APP_PORT:-3000}"
    volumes:
      - tracker-data:/app/backend/data
      - tracker-logs:/app/backend/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://127.0.0.1:$$PORT/health\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
  tracker-data:
  tracker-logs: